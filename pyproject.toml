[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enlace"
version = "0.1.57"
description = "Serve all your web apps from a single process — they don't import it, they don't know it's there"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["web", "platform", "fastapi", "asgi", "multi-app", "composition"]
authors = [{ name = "Thor Whalen" }]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "cw>=0.1.1,<0.2",
    "tomli>=1.1; python_version < '3.11'",
]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/i2mint/enlace"
Repository = "https://github.com/i2mint/enlace"
Issues = "https://github.com/i2mint/enlace/issues"

[project.scripts]
enlace = "enlace.__main__:main"

[project.optional-dependencies]
process = ["httpx>=0.24.0"]
# PNG renditions of app icons (apple-touch-icon, web-app manifest). Without it,
# icons still serve as-is; only the home-screen PNG sizes are unavailable.
icons = ["Pillow"]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio",
    "Pillow",
    "hatchling",  # tests/test_packaging.py lists what the sdist would contain
]

[tool.pytest.ini_options]
# The package dir, not just enlace/tests: wads CI runs `pytest --doctest-modules`
# with no path, so testpaths decides collection. Pointing at enlace/tests alone
# silently skipped every doctest in the package's own modules.
testpaths = ["enlace", "tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D100"]
ignore = ["D203"]

[tool.ruff.lint.per-file-ignores]
"enlace/diagnose.py" = ["E501"]  # Long lines in diagnostic prose strings
"tests/test_standalone_preservation.py" = ["E501"]

[project.entry-points."skill.skill_packs"]
enlace = "enlace:skills_dir"

[tool.wads.ci]
installer = "uv"

# Install the ``dev`` extra in CI — it carries ``httpx``, which
# ``starlette.testclient`` (imported by most tests) hard-requires. Without
# it, CI collected the suite with 12 ModuleNotFoundError: httpx errors and
# exited 2 (the repo-wide red CI predating this change). The reusable
# uv-ci.yml feeds this to install-deps via read-ci-config's install-extras.
[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.testing]
python_versions = ["3.10", "3.12"]
coverage_enabled = false
test_on_windows = false

[tool.hatch.build.targets.wheel]
packages = ["enlace"]

# .claude/skills/<name> are symlinks to enlace/data/skills/<name>. hatchling
# follows symlinks and visits each real directory once, walking .claude first,
# so without this the sdist (and the wheel CI builds from it) silently lost
# enlace/data/skills. tests/test_packaging.py pins it.
[tool.hatch.build.targets.sdist]
exclude = ["/.claude/skills"]
skip-excluded-dirs = true
